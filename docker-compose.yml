services:
  db:
    image: postgres:16-alpine
    container_name: albumpedia-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: albumpedia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DB/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    container_name: albumpedia-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: albumpedia

volumes:
  postgres_data: